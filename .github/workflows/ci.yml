name: Manual qualified-fleet validation
on:
  workflow_dispatch:
    inputs:
      route:
        description: Qualified route (no fallback)
        type: choice
        options:
          - naevum-vps-amd64
          - ci-linux-arm64
        default: naevum-vps-amd64
        required: true
      campaign:
        description: Owner-authorized campaign
        type: string
        default: apocryph-compute-20261021
        required: true
      rust_toolchain:
        description: Qualified standalone Rust release already installed in the image
        type: choice
        options:
          - '1.99.1'
        default: '1.99.1'
        required: true
      judge_surfaces_reviewed:
        description: Coordinator independently reviewed this exact source and checker
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  reference:
    if: ${{ inputs.judge_surfaces_reviewed == true && inputs.campaign == 'apocryph-compute-20261021' }}
    runs-on: ${{ inputs.route }}
    timeout-minutes: 20
    env:
      CI_ROUTE: ${{ inputs.route }}
      CI_CAMPAIGN: ${{ inputs.campaign }}
      QUALIFIED_RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
      CI_SOURCE_SHA: ${{ github.sha }}
      CI_JUDGE_SURFACES_REVIEWED: ${{ inputs.judge_surfaces_reviewed }}
      CARGO_NET_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Runtime preflight and exact source/toolchain
        run: python3 scripts/ci_preflight.py
      - name: Contract documentation validation
        run: python3 scripts/agent_sync.py --check
      - name: Offline tests and build on selected qualified route
        run: python3 scripts/ci_product.py
